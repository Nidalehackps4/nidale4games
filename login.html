<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts: Professional for headings + general text -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">

<title>NIDALE 4GAME</title>
<div class="stars"></div>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    overflow:hidden;
    position:relative;

    /* Background for game covers + consoles */
    background:linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url("https://images.unsplash.com/photo-1605902711622-cfb43c4437d1?w=1200"), url("https://images.unsplash.com/photo-1598550880863-4e8aa3d0a6f6?w=1200"), url("https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200");
    background-size:cover;
    background-position:center;
}

/* vignette + film-grain texture overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.45) 100%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' seed='1'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
    background-size: cover, 300px 300px;
    background-repeat: no-repeat, repeat;
}

/* Website title */
.site-title{
    font-family: 'Montserrat', sans-serif;
    font-size:44px;
    font-weight:700;
    color:#e6eefc;
    letter-spacing:2px;
    margin-bottom:10px;
    position:relative;
    animation:fadeIn 1s ease forwards;
    text-shadow:0 6px 18px rgba(0,0,0,0.6);
    z-index:2;
}
.menu-btn{
    position:fixed;
    left:18px;
    top:18px;
    z-index:1300;
    width:44px;
    height:44px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    align-items:center;
    padding:6px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(255,255,255,0.04);
    border-radius:10px;
    cursor:pointer;
    backdrop-filter: blur(6px);
}
.menu-btn:focus{outline:2px solid rgba(100,160,255,0.18)}
.menu-btn .dash{display:block; width:18px; height:2px; background:#e8f1ff; border-radius:2px; transition:transform .28s ease}

.menu-panel{
    position:fixed;
    left:18px;
    top:72px;
    z-index:1200;
    width:220px;
    background:linear-gradient(180deg, rgba(12,14,18,0.98), rgba(6,8,12,0.98));
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.04);
    box-shadow:0 14px 40px rgba(4,24,48,0.6);
    padding:10px;
    transform:translateY(-6px) scale(.98);
    opacity:0;
    pointer-events:none;
    transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .22s ease;
}
.menu-panel.open{transform:translateY(0) scale(1); opacity:1; pointer-events:auto}
.menu-panel ul{list-style:none}
.menu-panel .menu-link{display:block; padding:10px 8px; color:#e8f1ff; text-decoration:none; border-radius:8px}
.menu-panel .menu-link:hover{background:rgba(255,255,255,0.02); transform:translateX(6px)}

.stars{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:transparent url("https://www.transparenttextures.com/patterns/stardust.png") repeat;
    animation:moveStars 60s linear infinite;
    z-index:-2;
    opacity:0.4;
}

@keyframes moveStars{
    from{background-position:0 0;}
    to{background-position:10000px 5000px;}
}


/* Glitch effect */
.site-title::before,
.site-title::after{
    content:"NIDALE 4GAME";
    position:absolute;
    left:0;
    width:100%;
    opacity:0.7;
}

.site-title::before{
    color:#ff00c8;
    z-index:-1;
    animation:glitch 1s infinite;
}

.site-title::after{
    color:#00ffea;
    z-index:-2;
    animation:glitch 1s infinite reverse;
}

@keyframes glitch{
    0%{transform:translate(0);}
    20%{transform:translate(-2px,2px);}
    40%{transform:translate(-2px,-2px);}
    60%{transform:translate(2px,2px);}
    80%{transform:translate(2px,-2px);}
    100%{transform:translate(0);}
}

/* Login box */
.login-box{
    width:360px;
    padding:36px 32px 22px 32px;
    background:linear-gradient(180deg, rgba(10,12,16,0.95), rgba(6,8,10,0.95));
    border-radius:12px;
    box-shadow:0 12px 40px rgba(0,0,0,0.8), 0 6px 20px rgba(2,20,40,0.45);
    animation:slideUp 1s ease forwards;
    transform:translateY(30px);
    opacity:0;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.04);
    z-index:2;
}

/* single-color subtle glow instead of multicolor border */
.login-box::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border-radius:12px;
    box-shadow:0 0 40px rgba(40,120,255,0.06) inset;
    z-index:-1;
}

@keyframes glowBorder{
    0%{background-position:0 0;}
    50%{background-position:400% 0;}
    100%{background-position:0 0;}
}

.login-box h2{
    text-align:center;
    margin:6px 0 8px 0;
    color:#e8f1ff;
    font-size:20px;
}

/* Optional description under title */
.site-desc{
    text-align:center;
    color:rgba(230,240,255,0.92);
    font-size:16px;
    font-weight:500;
    margin-bottom:18px;
    line-height:1.35;
    max-width:560px;
    letter-spacing:0.2px;
    /* prepare for typing container */
    overflow:hidden;
    position:relative;
    z-index:2;
}

/* typing effect */
.typing{
    display:inline-block;
    min-height:22px;
    white-space:nowrap;
}
.typing::after{
    content:"";
    display:inline-block;
    width:2px;
    height:1.05em;
    margin-left:6px;
    background:linear-gradient(180deg,#e8f1ff,#cfe8ff);
    vertical-align:middle;
    animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{50%{opacity:0}}

/* Decorative icons inside login box */
.balloons{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}
/* Keep form above decorative icons */
.login-box h2,
.login-box form{
    position:relative;
    z-index:1;
}
/* Game-themed floating icons (controllers, coin, pixel heart) */
.game-icon{
    position:absolute;
    bottom:-90px;
    left:var(--left,10%);
    width:var(--size,36px);
    height:var(--size,36px);
    transform-origin:center bottom;
    animation:rise calc(6s + var(--i,0s) * 1s) linear infinite;
    opacity:0.95;
}
.game-icon svg{width:100%; height:100%; display:block;}
@keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(0.98);} 
    30%{opacity:1}
    100%{transform:translateY(-420px) rotate(18deg) scale(1.02); opacity:0.02}
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #0d7376;
    background:#111;
    color:white;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    box-shadow:0 0 10px #03ea4c;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg, #08e647 0%, #00c3cc 100%);
    color:black;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:0 4px 15px rgba(8, 230, 71, 0.3);
    text-transform:uppercase;
    letter-spacing:1px;
}

.login-btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition:left 0.5s;
}

.login-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 12px 25px rgba(8, 230, 71, 0.5), 0 0 30px rgba(0, 195, 204, 0.4);
    background:linear-gradient(135deg, #00c3cc 0%, #08e647 100%);
}

.login-btn:hover::before{
    left:100%;
}

.login-btn:active{
    transform:translateY(-1px) scale(0.98);
    box-shadow:0 6px 12px rgba(8, 230, 71, 0.4), 0 0 15px rgba(0, 195, 204, 0.3);
}

.login-btn::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    transform:translate(-50%, -50%);
    pointer-events:none;
}

.login-btn:active::after{
    animation:ripple 0.6s ease-out;
}

@keyframes ripple{
    0%{
        width:0;
        height:0;
        opacity:1;
    }
    100%{
        width:300px;
        height:300px;
        opacity:0;
    }
}

/* Social buttons */
.social-btn{
    display:inline-block;
    margin:6px 6px 0 6px;
    padding:8px 12px;
    font-size:13px;
    color:#e8f1ff;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.06));
    border-radius:8px;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.04);
    transition:transform .18s ease, box-shadow .18s ease;
}
.social-btn:hover{transform:translateY(-4px); box-shadow:0 8px 20px rgba(40,120,255,0.08)}

/* Animations */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-30px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes slideUp{
    to{
        transform:translateY(0);
        opacity:1;
    }
}

/* Social Media Buttons */
.social-buttons-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
}

.button {
  cursor: pointer;
  width: 50px;
  height: 50px;
  border-radius: 50px;
  border: none;
  background: linear-gradient(120deg, #833ab4, #fd1d1d, #fcb045);
  position: relative;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 10px;
  transition: 0.1s;
}

.button svg {
  color: white;
  width: 30px;
  height: 30px;
  z-index: 9;
}

.button:nth-child(3) {
  background: linear-gradient(120deg, #02ff2c, #008a12);
}

.button:nth-child(4) {
  background: rgb(69, 187, 255);
}

.button:nth-child(5) {
  background: rgb(255, 33, 33);
}

.button:nth-child(6) {
  background: black;
}

.button:active {
  transform: scale(0.85);
}

.button::before {
  content: "";
  position: absolute;
  width: 55px;
  height: 55px;
  background-color: #212121;
  border-radius: 50px;
  z-index: -1;
  border: 0px solid rgba(255, 255, 255, 0.411);
  transition: 0.4s;
}

.button:hover::before {
  width: 0px;
  height: 0px;
}

</style>
</head>

            </svg>
        </button>
    </div>
</div>

</body>
<script>
// Typing effect (simple, accessible)
document.addEventListener('DOMContentLoaded', function(){
    const el = document.querySelector('.typing');
    if(!el) return;
    const text = el.getAttribute('data-text') || el.textContent.trim();
    el.textContent = '';
    let i = 0;
    const speed = 34; // ms per char
    function type(){
        if(i <= text.length){
            el.textContent = text.slice(0,i);
            i++;
            setTimeout(type, speed + Math.random()*20);
        }
    }
    // small delay before typing
    setTimeout(type, 300);

    // menu toggle
    const menuBtn = document.getElementById('menu-btn');
    const panel = document.getElementById('menu-panel');
    function closeMenu(){
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden','true');
        menuBtn.setAttribute('aria-expanded','false');
    }
    function openMenu(){
        panel.classList.add('open');
        panel.setAttribute('aria-hidden','false');
        menuBtn.setAttribute('aria-expanded','true');
    }
    menuBtn.addEventListener('click', function(e){
        const opened = panel.classList.contains('open');
        if(opened) closeMenu(); else openMenu();
    });
    // close when clicking outside
    document.addEventListener('click', function(ev){
        if(!panel.classList.contains('open')) return;
        const path = ev.composedPath ? ev.composedPath() : (ev.path || []);
        if(path.indexOf(panel) >= 0 || path.indexOf(menuBtn) >= 0) return;
        closeMenu();
    });
    // close on Esc
    document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeMenu(); });
});
</script>
</html>
